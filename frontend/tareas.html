<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Tareas - LMS</title>
  <link rel="stylesheet" href="../css/tablas.css">
</head>
<body>
  <header>
    <a href="../index.html">&larr; Todas las tablas</a>
    <h1>Tabla de Tareas</h1>
    <p class="endpoint">GET <code>/api/cursos/{idCurso}/tareas</code></p>
    <p class="nota">Tareas de un curso. {idCurso} es el id del curso.</p>
    <p class="nota">Las filas se cargarán con Fetch. Esta página solo construye la tabla.</p>
  </header>
  <main>
    <div class="tabla-contenedor">
      <table data-endpoint="/api/cursos/{idCurso}/tareas" data-recurso="tareas">
        <thead>
          <tr>
            <th data-campo="idTarea">ID</th>
            <th data-campo="curso.nombre">Curso</th>
            <th data-campo="curso.idCurso">ID curso</th>
            <th data-campo="titulo">Título</th>
            <th data-campo="descripcion">Descripción</th>
            <th data-campo="fechaProgramada">Fecha programada</th>
            <th data-campo="fechaLimite">Fecha límite</th>
            <th data-campo="esEquipo">¿Es en equipo?</th>
          </tr>
        </thead>
        <tbody id="tabla-tareas-cuerpo">
          <!-- Las filas se llenan con Fetch (tarea de Luis). No se agrega lógica aquí. -->
          <tr class="sin-datos">
            <td colspan="8">Sin registros todavía.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</body>
</html>
