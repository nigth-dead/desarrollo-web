<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario · LMS Desarrollo Web</title>
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/registro.css">
</head>
<body>
    <header id="encabezadoSistema" class="encabezado-sistema"></header>

    <main class="contform">
        <form id="formRegistro" class="apartado">
            <h1>Registrar usuario</h1>


            <label for="registroNombre">Nombre completo</label>
            <input type="text" id="registroNombre" name="nombre" placeholder="Tu nombre completo" required>

            <label for="registroEmail">Correo</label>
            <input type="email" id="registroEmail" name="email" placeholder="tucorreo@uv.mx" required>

            <label for="registroPassword">Contraseña</label>
            <input type="password" id="registroPassword" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>

            <label for="registroPassword2">Confirmar contraseña</label>
            <input type="password" id="registroPassword2" name="password2" placeholder="Repite tu contraseña" required>

            <label for="registroRol">Rol</label>
            <select id="registroRol" name="rol" required>
                <option value="ALUMNO">Alumno</option>
                <option value="MAESTRO">Maestro</option>
                <option value="ADMIN">Administrador</option>
            </select>

            <div class="acciones-form">
                <button type="submit" class="btn btn-primario">Crear cuenta</button>
            </div>
        </form>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/validacion.js"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
