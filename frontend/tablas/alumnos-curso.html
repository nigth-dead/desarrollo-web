<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Alumnos de un curso - LMS</title>
  <link rel="stylesheet" href="../css/tablas.css">
</head>
<body>
  <header>
    <a href="../index.html">&larr; Todas las tablas</a>
    <h1>Tabla de Alumnos de un curso</h1>
    <p class="endpoint">GET <code>/api/cursos/{id}/alumnos</code></p>
    <p class="nota">Alumnos inscritos en un curso. {id} es el id del curso.</p>
    <p class="nota">Las filas se cargarán con Fetch. Esta página solo construye la tabla.</p>
  </header>
  <main>
    <div class="tabla-contenedor">
      <table data-endpoint="/api/cursos/{id}/alumnos" data-recurso="alumnos de un curso">
        <thead>
          <tr>
            <th data-campo="id.idCurso">ID curso</th>
            <th data-campo="id.idAlumno">ID alumno</th>
            <th data-campo="alumno.nombre">Alumno</th>
            <th data-campo="alumno.email">Email del alumno</th>
            <th data-campo="fechaInscripcion">Fecha de inscripción</th>
          </tr>
        </thead>
        <tbody id="tabla-alumnos-curso-cuerpo">
          <!-- Las filas se llenan con Fetch (tarea de Luis). No se agrega lógica aquí. -->
          <tr class="sin-datos">
            <td colspan="5">Sin registros todavía.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
  <script src="../js/api.js"></script>
  <script src="../js/tablas.js"></script>
</body>
</html>
