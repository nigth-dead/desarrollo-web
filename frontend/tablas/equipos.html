<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Equipos - LMS</title>
  <link rel="stylesheet" href="../css/tablas.css">
</head>
<body>
  <header>
    <a href="../index.html">&larr; Todas las tablas</a>
    <h1>Tabla de Equipos</h1>
    <p class="endpoint">GET <code>/api/tareas/{idTarea}/equipos</code></p>
    <p class="nota">Equipos de una tarea. {idTarea} es el id de la tarea.</p>
    <p class="nota">Las filas se cargarán con Fetch. Esta página solo construye la tabla.</p>
  </header>
  <main>
    <div class="tabla-contenedor">
      <table data-endpoint="/api/tareas/{idTarea}/equipos" data-recurso="equipos">
        <thead>
          <tr>
            <th data-campo="idEquipo">ID</th>
            <th data-campo="tarea.titulo">Tarea</th>
            <th data-campo="tarea.idTarea">ID tarea</th>
            <th data-campo="nombreEquipo">Nombre del equipo</th>
            <th data-campo="integrantes">Integrantes</th>
          </tr>
        </thead>
        <tbody id="tabla-equipos-cuerpo">
          <!-- Las filas se llenan con Fetch (tarea de Luis). No se agrega lógica aquí. -->
          <tr class="sin-datos">
            <td colspan="5">Sin registros todavía.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
  <script src="../js/api.js"></script>
  <script src="../js/tablas.js"></script>
</body>
</html>
