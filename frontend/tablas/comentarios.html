<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Comentarios de foro - LMS</title>
  <link rel="stylesheet" href="../css/tablas.css">
</head>
<body>
  <header>
    <a href="../index.html">&larr; Todas las tablas</a>
    <h1>Tabla de Comentarios de foro</h1>
    <p class="endpoint">GET <code>/api/foros/{idForo}/comentarios</code></p>
    <p class="nota">Comentarios de un foro. {idForo} es el id del foro.</p>
    <p class="nota">Las filas se cargarán con Fetch. Esta página solo construye la tabla.</p>
  </header>
  <main>
    <div class="tabla-contenedor">
      <table data-endpoint="/api/foros/{idForo}/comentarios" data-recurso="comentarios de foro">
        <thead>
          <tr>
            <th data-campo="idComentario">ID</th>
            <th data-campo="foro.titulo">Foro</th>
            <th data-campo="foro.idForo">ID foro</th>
            <th data-campo="usuario.nombre">Usuario</th>
            <th data-campo="usuario.idUsuario">ID usuario</th>
            <th data-campo="contenido">Contenido</th>
            <th data-campo="fechaComentario">Fecha</th>
          </tr>
        </thead>
        <tbody id="tabla-comentarios-cuerpo">
          <!-- Las filas se llenan con Fetch (tarea de Luis). No se agrega lógica aquí. -->
          <tr class="sin-datos">
            <td colspan="7">Sin registros todavía.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
  <script src="../js/api.js"></script>
  <script src="../js/tablas.js"></script>
</body>
</html>
