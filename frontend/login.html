<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - LMS</title>
  <link rel="stylesheet" href="css/tablas.css">
</head>
<body>
  <header>
    <h1>Iniciar sesión</h1>
    <p class="nota">El servidor devuelve un token que se guarda en el navegador y se manda en cada petición.</p>
  </header>
  <main>
    <form id="form-login" class="form-login">
      <label>Email
        <input type="email" name="email" required autocomplete="username">
      </label>
      <label>Contraseña
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Entrar</button>
      <p id="mensaje-login" class="error" role="alert"></p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const mensaje = document.getElementById('mensaje-login');
    // a donde regresar despues de entrar (solo paginas de este mismo sitio)
    const volver = new URLSearchParams(location.search).get('volver');
    const destino = volver && new URL(volver, location.href).origin === location.origin ? volver : 'index.html';

    if (api.sesion.activa()) {
      location.href = destino;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensaje.textContent = '';
      const datos = new FormData(form);
      try {
        await api.auth.login(datos.get('email'), datos.get('password'));
        location.href = destino;
      } catch (err) {
        mensaje.textContent = err.mensaje;
      }
    });
  </script>
</body>
</html>
