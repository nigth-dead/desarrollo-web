<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS · Desarrollo Web</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <header id="encabezadoSistema" class="encabezado-sistema"></header>

    <main class="login-centrado">
        <div class="login-tarjeta">
            <div class="login-logo">L</div>
            <h1 class="login-titulo">LMS Desarrollo Web</h1>
            <form id="formLogin">

                <label for="loginEmail">Correo institucional</label>
                <input type="email" id="loginEmail" name="email" placeholder="tucorreo@uv.mx" required>

                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" name="password" placeholder="Tu contraseña" required>

                <div class="acciones-form">
                    <button type="submit" class="btn btn-primario btn-bloque">Iniciar sesión</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
