spring.application.name=backend
server.port=8081
spring.datasource.url=jdbc:mysql://${BASE_DATOS}:3306/lms_db
spring.datasource.username=listi
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update

# Token de sesion (JWT). En produccion el secreto se pasa por variable de entorno JWT_SECRETO
app.jwt.secreto=${JWT_SECRETO:lms-desarrollo-web-equipo2-clave-solo-para-desarrollo}
app.jwt.duracion-horas=8
# true: todas las rutas /api/** (menos login y registro) piden token
app.auth.requerir-token=true
# Origenes del frontend que pueden usar fetch (Live Server, http.server, etc.)
app.cors.origenes=http://localhost:*,http://127.0.0.1:*
